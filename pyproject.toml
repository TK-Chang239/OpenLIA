[project]
name = "openlia-workspace"
version = "0.0.0"
description = "OpenLIA monorepo workspace root (not an installable package)."
requires-python = ">=3.12"
dependencies = [
    "eodhd>=1.0.32",
    "markdown-it-py>=4.0.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/server/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "-m", "not live_api",
]
markers = [
    "live_api: hits a real third-party API. Requires the relevant *_API_KEY env var. Skipped by default; opt in with `-m live_api`.",
    "slow: marks tests as slow (deselect with -m 'not slow').",
    "requires_llm: marks tests that require real LLM API access. Opt in with -m requires_llm.",
]
