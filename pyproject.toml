[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/server/tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
