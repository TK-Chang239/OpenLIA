# LAN-only deployment: OpenLIA bound to the host's local network without a
# reverse proxy. Cookies are NOT marked Secure (no TLS).
#
# Start:
#   OPENLIA_IMAGE=ghcr.io/your-org/openlia:latest \
#   docker compose up -d
#
# Then open http://<host-ip>:8000 from another machine on the LAN.

services:
  openlia:
    image: ${OPENLIA_IMAGE:-ghcr.io/openlia/openlia:latest}
    restart: unless-stopped
    environment:
      OPENLIA_MODE: company
      OPENLIA_COOKIE_SECURE: "false"
      OPENLIA_DB_URL: sqlite:////home/openlia/.openlia/openlia.db
      OPENLIA_SCHEDULER_ENABLED: "true"
      OPENLIA_SECRET_KEY: ${OPENLIA_SECRET_KEY:-}
    volumes:
      - openlia_data:/home/openlia/.openlia
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  openlia_data:
