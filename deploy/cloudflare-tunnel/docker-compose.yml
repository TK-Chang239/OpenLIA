# Cloudflare Tunnel deployment.
#
# Cloudflare Tunnel terminates TLS at Cloudflare's edge and forwards
# inbound HTTPS traffic to the OpenLIA container over a private tunnel.
# No host port is published; the container is reachable only over the
# docker network and the tunnel sidecar.
#
# Required environment variables (see .env.example):
#   OPENLIA_IMAGE          ghcr.io/<org>/openlia:<tag>
#   OPENLIA_SECRET_KEY     base64 32-byte AES-256-GCM key
#   TUNNEL_TOKEN           Cloudflare Zero Trust tunnel credentials token
#
# Start:
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
services:
  openlia:
    image: ${OPENLIA_IMAGE:-ghcr.io/tk-chang239/openlia:latest}
    restart: unless-stopped
    environment:
      OPENLIA_MODE: company
      OPENLIA_TRUST_PROXY_HEADERS: "true"
      OPENLIA_COOKIE_SECURE: "true"
      OPENLIA_DB_URL: sqlite:////home/openlia/.openlia/openlia.db
      OPENLIA_SCHEDULER_ENABLED: "true"
      OPENLIA_SECRET_KEY: ${OPENLIA_SECRET_KEY:-}
      OPENLIA_PUBLIC_URL: ${OPENLIA_PUBLIC_URL:-}
    volumes:
      - openlia_data:/home/openlia/.openlia
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      openlia:
        condition: service_healthy

volumes:
  openlia_data:
