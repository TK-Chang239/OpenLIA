# LAN-only deployment.
#
# OpenLIA bound to 0.0.0.0:8080 on the host with no TLS. Defaults to
# personal mode (no auth) for a single-user workstation. Switch to
# company mode by setting OPENLIA_MODE=company in `.env` and running the
# admin invite-create flow afterward.
#
# Cookies are NOT marked Secure because the browser will speak plain
# HTTP. Do NOT expose this recipe directly to the public internet.
#
# Start:
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# Then open http://<host-ip>:8080 from another machine on the LAN.
services:
  openlia:
    image: ${OPENLIA_IMAGE:-ghcr.io/tk-chang239/openlia:latest}
    restart: unless-stopped
    environment:
      OPENLIA_MODE: ${OPENLIA_MODE:-personal}
      OPENLIA_COOKIE_SECURE: "false"
      OPENLIA_DB_URL: sqlite:////home/openlia/.openlia/openlia.db
      OPENLIA_SCHEDULER_ENABLED: "true"
      OPENLIA_SECRET_KEY: ${OPENLIA_SECRET_KEY:-}
    volumes:
      - openlia_data:/home/openlia/.openlia
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  openlia_data:
