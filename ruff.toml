target-version = "py312"
line-length = 100
extend-exclude = ["scripts/"]  # legacy one-off tooling, not part of the shipped product

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
]
ignore = []

[lint.per-file-ignores]
"**/tests/**" = ["B011"]  # allow `assert False` patterns in tests

[format]
quote-style = "double"
indent-style = "space"
