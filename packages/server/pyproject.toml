[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "openlia"
version = "0.1.0"
description = "OpenLIA — open-source, self-hosted AI investor assistant. FastAPI server, CLI, and persistence layer."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "OpenLIA contributors"}]
license = {text = "MIT"}
keywords = [
    "ai",
    "llm",
    "finance",
    "investor",
    "research",
    "equity",
    "macro",
    "fastapi",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "openlia-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "typer>=0.12",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "email-validator>=2.2",
    "apscheduler>=4.0.0a4",
    "croniter>=2.0",
    "playwright>=1.58.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
openlia = "openlia_server.cli:main"

[project.urls]
Homepage = "https://github.com/TK-Chang239/OpenLIA"
Repository = "https://github.com/TK-Chang239/OpenLIA"
Issues = "https://github.com/TK-Chang239/OpenLIA/issues"
Changelog = "https://github.com/TK-Chang239/OpenLIA/blob/main/CHANGELOG.md"

[tool.uv.sources]
openlia-core = { workspace = true }

[tool.uv.build-backend]
module-name = "openlia_server"
module-root = "src"
