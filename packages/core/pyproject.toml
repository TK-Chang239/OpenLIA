[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "openlia-core"
version = "0.1.0"
description = "OpenLIA core library — departments, LLM adapters, data adapters, report generation. Pure Python library. No server-side HTTP frameworks (FastAPI, uvicorn, SQLAlchemy)."
requires-python = ">=3.12"
authors = [{name = "OpenLIA contributors"}]
license = {text = "MIT"}
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.build-backend]
module-name = "openlia"
module-root = "src"

[tool.hatch.build.targets.wheel.force-include]
"src/openlia/prompts" = "openlia/prompts"
"src/openlia/reports/frameworks" = "openlia/reports/frameworks"
