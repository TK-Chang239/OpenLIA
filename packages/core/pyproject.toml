[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "openlia-core"
version = "0.1.0"
description = "OpenLIA core library — departments, LLM adapters, data adapters, report generation. Pure Python library. No server-side HTTP frameworks (FastAPI, uvicorn, SQLAlchemy)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "OpenLIA contributors"}]
license = {text = "MIT"}
keywords = ["ai", "llm", "finance", "investor", "research", "equity", "macro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "mcp>=1.0",
    # Report-rendering runtime deps. matplotlib renders chart PNGs
    # (llm/runtime/*/rendering/chart_renderer.py); markdown-it-py converts
    # section markdown to HTML (rendering/report_assembler.py). Both are
    # imported at report-generation time — declared here so a standalone
    # `pip install openlia-core` wheel ships them (Docker gets them via
    # the workspace root's --all-packages install).
    "matplotlib>=3.10.9",
    "markdown-it-py>=4.0.0",
    # Hard deps of openlia.data.* wrapper modules that ship with the day-1
    # built-in connector catalog. Imported eagerly when any built-in's
    # python_lib mode is validated.
    "eodhd>=1.0.32",
    "firecrawl-py>=4.0.0,<5.0.0",
    "eventregistry>=9.0,<10.0",
    "xdk>=0.9.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/TK-Chang239/OpenLIA"
Repository = "https://github.com/TK-Chang239/OpenLIA"
Issues = "https://github.com/TK-Chang239/OpenLIA/issues"
Changelog = "https://github.com/TK-Chang239/OpenLIA/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.build-backend]
module-name = "openlia"
module-root = "src"
# uv_build ships every file under module-root by default; explicitly list
# non-Python resource directories so prompts/frameworks land in the wheel
# (and so removal of any item here is a deliberate, reviewable change).
source-include = [
    "src/openlia/prompts/**/*.yaml",
    "src/openlia/reports/frameworks/**/*",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23",
]
