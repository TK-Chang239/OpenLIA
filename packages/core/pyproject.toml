[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "openlia-core"
version = "0.1.0"
description = "OpenLIA core library — departments, LLM adapters, data adapters, report generation. Pure Python library. No server-side HTTP frameworks (FastAPI, uvicorn, SQLAlchemy)."
readme = "../../README.md"
requires-python = ">=3.12"
authors = [{name = "OpenLIA contributors"}]
license = {text = "MIT"}
keywords = ["ai", "llm", "finance", "investor", "research", "equity", "macro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/TK-Chang239/OpenLIA"
Repository = "https://github.com/TK-Chang239/OpenLIA"
Issues = "https://github.com/TK-Chang239/OpenLIA/issues"
Changelog = "https://github.com/TK-Chang239/OpenLIA/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.build-backend]
module-name = "openlia"
module-root = "src"

[tool.hatch.build.targets.wheel.force-include]
"src/openlia/prompts" = "openlia/prompts"
"src/openlia/reports/frameworks" = "openlia/reports/frameworks"
