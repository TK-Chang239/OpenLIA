# Macro Research deterministic-runner needs (spec §5.4).
#
# Each entry is a stable, code-facing need id referenced from the
# MR dashboards' T1_REQUIREMENTS lists. The wizard-time adapter LLM
# resolves each id to a concrete callable on a configured financial
# (or news) connector. At runtime the dispatcher binds the
# parameters declared here to the resolved callable's arguments.
#
# Need ids are treated as a public API: once shipped, they do not
# change.

department: macro_research
needs:
  - id: debt_gdp
    description: |
      Government gross debt as a percentage of GDP, in percentage points
      (e.g., 110.0 means 110%). Sourced from official government
      statistics, central-bank releases, or aggregator endpoints
      (FRED, IMF). Used by the Debt Cycle dashboard.
    parameters:
      - name: country
        description: "ISO 3166-1 alpha-2 code; defaults to 'US'."
        type: str
        required: false
        default: "US"
    shape: float

  - id: interest_revenue
    description: |
      Federal interest expense as a percentage of federal revenue
      (or, equivalently, debt-service-to-revenue). Used by the Debt
      Cycle dashboard as a sovereign-stress trigger.
    parameters:
      - name: country
        description: "ISO 3166-1 alpha-2 code; defaults to 'US'."
        type: str
        required: false
        default: "US"
    shape: float

  - id: pmi
    description: |
      Manufacturing Purchasing Managers' Index. Diffusion index where
      values above 50 indicate expansion. Used by the Four Seasons
      dashboard for the growth-axis read.
    parameters:
      - name: country
        description: "ISO 3166-1 alpha-2 code; defaults to 'US'."
        type: str
        required: false
        default: "US"
    shape: float

  - id: gdp_yoy
    description: |
      Real GDP year-over-year percentage change. Used by the Four
      Seasons dashboard alongside PMI to score the growth axis.
    parameters:
      - name: country
        description: "ISO 3166-1 alpha-2 code; defaults to 'US'."
        type: str
        required: false
        default: "US"
    shape: float

  - id: cpi_yoy
    description: |
      Headline Consumer Price Index year-over-year percentage change.
      Used by the Four Seasons dashboard for the inflation axis.
    parameters:
      - name: country
        description: "ISO 3166-1 alpha-2 code; defaults to 'US'."
        type: str
        required: false
        default: "US"
    shape: float

  - id: cpi_core_yoy
    description: |
      Core (ex-food-and-energy) CPI year-over-year percentage change.
      Used by Four Seasons as a secondary inflation read.
    parameters:
      - name: country
        description: "ISO 3166-1 alpha-2 code; defaults to 'US'."
        type: str
        required: false
        default: "US"
    shape: float

  - id: usd_fx_reserve_share
    description: |
      USD share of global FX reserves (IMF COFER, percentage). Used
      by the World Order dashboard to track reserve-currency hegemony.
    parameters: []
    shape: float

  - id: cb_gold_purchases
    description: |
      Net central-bank gold purchases over the trailing window, in
      tonnes. Used by World Order as a reserve-diversification signal.
    parameters:
      - name: window_days
        description: "Trailing window in days; defaults to 365."
        type: int
        required: false
        default: 365
    shape: float

  - id: foreign_treasury_holdings
    description: |
      Total foreign-held US Treasuries (TIC data), trailing-window
      change in USD billions. Used by World Order to track
      reserve-rebalancing.
    parameters:
      - name: window_days
        description: "Trailing window in days; defaults to 90."
        type: int
        required: false
        default: 90
    shape: float

  - id: stock_quote
    description: |
      Latest closing price for an equity given its NYSE/NASDAQ ticker
      symbol. Used by MR dashboards for macro-proxy ETFs (TIP for
      real-rate stress, UUP for the dollar, HYG and LQD for credit
      spreads). One callable, parameterized by ticker.
    parameters:
      - name: ticker
        description: "Ticker symbol, e.g. 'TIP', 'UUP', 'HYG', 'LQD'."
        type: str
        required: true
    shape: float

  - id: geopolitical_news
    description: |
      Recent geopolitical-conflict and reserve-policy headlines. Used
      by the World Order dashboard's narrative-context layer; not used
      for hard scoring.
    parameters:
      - name: window_days
        description: "Lookback window in days; defaults to 7."
        type: int
        required: false
        default: 7
      - name: limit
        description: "Maximum number of headlines to return."
        type: int
        required: false
        default: 25
    shape: list[dict]
