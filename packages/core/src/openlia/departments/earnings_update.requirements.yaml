financial:
  required: true
  description: |
    Need earnings_data covering the upcoming and recently reported earnings
    calendar, plus financial_statements for post-print fundamentals and
    stock_quote for current pricing context. Historical_prices and
    analyst_ratings are consumed when available to frame the print against
    expectations.
news:
  required: true
  description: |
    Company-tagged news (company_news) with publication date and source for
    earnings reactions, pre-announcements, guidance updates, and conference
    call coverage. Earnings_transcripts are pulled when available for
    direct management commentary on the earnings_analysis report.
