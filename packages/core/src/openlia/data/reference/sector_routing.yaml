# GICS-based sector routing for the v2.2 equity research engine.
#
# Maps GICS sub-industry codes (6-digit) to sector module template names.
# GICS 2023 taxonomy is current as of 2026 — MSCI last restructured the
# standard in March 2023 (Real Estate moved to its own sector in 2016;
# Communication Services created in 2018; no further top-level changes).
#
# Source cross-reference: MSCI GICS 2023 Structure document and
# S&P GICS methodology guide (verified against public MSCI GICS page).
#
# CODE CONFIDENCE NOTES:
#   "verified"   — code confirmed in the 2023 GICS structure document.
#   "TODO: verify" — plausible but not confirmed from an authoritative source;
#                    user should validate before live use.
#
# GICS hierarchy: Sector > Industry Group > Industry > Sub-Industry
# The 6-digit code is the sub-industry code.  The first 2 digits are the
# sector; the first 4 are the industry; the first 6 are the sub-industry.
#
# See: https://www.msci.com/our-solutions/indexes/gics
#
# default_template is used when no GICS code matches (e.g. unknown or None).

gics_routing:

  banks:
    template: "banks_v2_2"
    gics_codes:
      - "401010"  # Diversified Banks — verified (GICS 2023)
      - "401020"  # Regional Banks — verified (GICS 2023; renamed from "Commercial Banks & Thrifts" pre-2023)
      - "402020"  # Investment Banking & Brokerage — verified (GICS 2023; old "Diversified Financial Services" name retired)
      # Note: 401010 / 401020 are both within the Banks industry (4010).
      # 402020 (Investment Banking & Brokerage) is grouped with banks here
      # as a POLICY CHOICE for fundamental analysis; technically a separate
      # industry (4020 — Capital Markets). Remove from this list if your
      # framework treats them as a distinct sector.

  reits:
    template: "reits_v2_2"
    gics_codes:
      - "601010"  # Diversified REITs — verified
      - "601020"  # Industrial REITs — verified
      - "601025"  # Hotel & Resort REITs — verified
      - "601030"  # Office REITs — verified
      - "601040"  # Health Care REITs — verified
      - "601050"  # Residential REITs — verified
      - "601060"  # Retail REITs — verified
      - "601070"  # Specialized REITs — verified
      - "602010"  # Real Estate Operating Companies — verified
      - "602020"  # Real Estate Development — verified
      - "602030"  # Real Estate Services — verified

  pharma:
    template: "pharma_v2_2"
    gics_codes:
      - "352010"  # Pharmaceuticals — verified
      - "352020"  # Biotechnology — verified
      - "352030"  # Life Sciences Tools & Services — verified

  energy_ep:
    template: "energy_ep_v2_2"
    gics_codes:
      - "101010"  # Energy Equipment & Services — verified (GICS 2023; only sub-industry in 1010)
      # 101020 and 101030 removed: under GICS 2023, industry 1010 has only one
      # sub-industry (101010). The 102xxx codes below cover the full E&P range.
      - "102010"  # Integrated Oil & Gas — verified
      - "102020"  # Oil & Gas Exploration & Production — verified
      - "102030"  # Oil & Gas Refining & Marketing — verified
      - "102040"  # Oil & Gas Storage & Transportation — verified
      - "102050"  # Coal & Consumable Fuels — verified

  insurance:
    template: "insurance_v2_2"
    gics_codes:
      - "403010"  # Insurance Brokers — verified
      - "403020"  # Life & Health Insurance — verified
      - "403030"  # Multi-line Insurance — verified
      - "403040"  # Property & Casualty Insurance — verified
      - "403050"  # Reinsurance — verified

# Fallback when no code matches or code is None.
default_template: "stock_initiation_v2"
