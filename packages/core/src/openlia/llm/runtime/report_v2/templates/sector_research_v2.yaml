template_id: sector_research_v2
template_name: "Sector Research (v2)"
department: equity_research
report_type: sector_research
engine_version_compat: "2.2"

composer_inputs:
  - name: sector
    type: sector
    label: Sector
    required: true

required_artifacts: []

sections:
  - id: industry_primer
    name: "Industry Primer"
    directive: >
      Define the sector's scope, key sub-segments, and market size.
      Cover TAM, growth rate, and the major structural forces shaping
      the industry. Preferred exhibits: a table for TAM/SAM/SOM and
      a pie or treemap for segment breakdown.

  - id: key_drivers
    name: "Key Drivers and Trends"
    directive: >
      Identify the two to five macro and sector-specific drivers that
      will most influence performance over the next twelve to thirty-six
      months. Distinguish cyclical from secular trends.
    depends_on: [industry_primer]

  - id: competitive_landscape
    name: "Competitive Landscape"
    directive: >
      Map the major players by revenue scale, growth rate, and market
      position. Highlight consolidation dynamics, new entrants, and
      barriers to entry. Use a ranked table or treemap for market share.
    depends_on: [industry_primer]

  - id: sector_theses
    name: "Sector Theses"
    directive: >
      Synthesize two to four investment theses that apply across the
      sector (e.g. a rising tide, a bifurcation, a disruption). For
      each thesis state the supporting evidence, the key risk, and
      which player types benefit most. Attribute all buy/hold/sell
      language to cited analyst sources.
    depends_on: [key_drivers, competitive_landscape]
