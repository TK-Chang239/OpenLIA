# Artifact type registry — seed for v2.2 report engine.
# Each entry declares fidelity descriptions and DAG dependencies.
# 4 Stage-7a core types (landing in PR 0.3) + 8 helper-produced types (migrated in PR 0.2).
#
# IMPORTANT: depends_on lists ArtifactType names that MUST be produced before
# this type can be consumed. Boot-time DAG validation enforces no cycles.
#
# deprecated_at_pr: set on types scheduled for removal in a future PR.
# This key is for tracking only — the L2 projection does NOT surface it to the LLM.

artifact_types:

  # -----------------------------------------------------------------------
  # Stage-7a core types (PR 0.3)
  # -----------------------------------------------------------------------

  - name: section_plan
    description: >
      Structured plan mapping report sections to artifact IDs and fidelity levels.
      Produced by Stage 5 planner; consumed by Stage 7a materialization.
    fidelity:
      headline: "One-line summary of section layout (N sections, M artifacts)"
      summary: "Section list with artifact IDs and requested fidelity levels"
      full: "Complete ReportSectionPlan JSON including overrides_applied"
    depends_on: []

  - name: materialized_section
    description: >
      Rendered markdown for a single report section after fidelity projection and
      deduplication. Produced by Stage 7a; consumed by Stage 7b drafter.
    fidelity:
      headline: "Section title + one-sentence summary of rendered content"
      summary: "Section title + first artifact headline + artifact count"
      full: "Full rendered section markdown with all artifact renders at resolved fidelity"
    depends_on:
      - section_plan

  - name: fidelity_hint
    description: >
      Planner-emitted advisory specifying preferred fidelity for a named artifact
      in the current run. Overrides template defaults when present.
    fidelity:
      headline: "Artifact ID + fidelity level override"
      summary: "Artifact ID + fidelity + rationale note"
      full: "Full SectionPlanOverride record with rationale"
    depends_on:
      - section_plan

  - name: rendered_artifact
    description: >
      Markdown-rendered form of any helper-produced artifact at a specific fidelity.
      The Stage-7a output atom that Stage-7b consumes.
    fidelity:
      headline: "One-liner with the key number from the artifact"
      summary: "Compact table or chart caption (~200-400 tokens)"
      full: "Complete artifact markdown (~800-2000 tokens)"
    depends_on: []

  # -----------------------------------------------------------------------
  # Helper-produced artifact types (8 helpers migrated in PR 0.2)
  # -----------------------------------------------------------------------

  - name: dcf_valuation_output
    description: >
      Full DCF valuation result: WACC, projected FCF schedule, terminal value
      (perpetuity and exit-multiple methods), enterprise and equity value, per-share
      value, and 2-D sensitivity table over WACC x terminal growth.
    fidelity:
      headline: "DCF fair value = $X (perpetuity) / $Y (exit multiple)"
      summary: "WACC, terminal growth, EV and equity value per method, implied price range"
      full: "Complete FCF schedule, terminal value decomposition, sensitivity grid"
    depends_on: []

  - name: chart_artifact
    description: >
      Inline SVG chart (line, bar, scatter, or heatmap) rendered by matplotlib.
      General-purpose visual; consumed by any section that needs a chart embed.
    fidelity:
      headline: "Chart title and type (e.g. 'Revenue trend -- line chart')"
      summary: "Chart title, axes labels, and data range summary"
      full: "Inline SVG content (base64 or raw SVG string)"
    depends_on: []

  - name: ratio_panel
    description: >
      Financial ratios across profitability, liquidity, leverage, efficiency, and
      valuation categories with benchmark interpretation.
    fidelity:
      headline: "Key ratios summary: ROE X%, gross margin Y%, D/E Z"
      summary: "Profitability + liquidity + valuation ratios table with benchmark flags"
      full: "All five ratio categories with values, formulas, and interpretations"
    depends_on: []
    deprecated_at_pr: "2.5"

  - name: saas_metrics_output
    description: >
      SaaS unit economics: MRR/ARR, ARPA, churn, CAC, LTV, LTV:CAC, payback,
      NRR, Rule of 40. Supports metrics, quick-ratio, and simulation modes.
    fidelity:
      headline: "ARR $X, NRR Y%, LTV:CAC Z -- Rule of 40: W"
      summary: "Core SaaS KPIs table: ARR, churn, CAC, LTV, NRR, Rule of 40"
      full: "Full SaaS metrics with quick ratio breakdown and unit economics simulation"
    depends_on: []
    deprecated_at_pr: "2.9"

  - name: saas_kpi_panel_output
    description: >
      Quarterly SaaS KPI synthesis panel: ARR (YoY/QoQ growth), NRR, GRR,
      implied churn rate, Magic Number (net_new_ARR / S&M_prior_Q), RPO,
      Billings, CAC payback period, LTV/CAC, customer concentration, Rule of 40,
      composite SaaS health score, disclosure completeness, and warnings.
      Supersedes saas_metrics_output (deprecated at PR 2.9).
    fidelity:
      headline: "ARR $X (YoY +Y%), NRR Z%, Rule of 40: W, Magic Number: V"
      summary: "ARR growth, NRR, GRR, Magic Number, LTV:CAC, Rule of 40, health score"
      full: "All KPIs with classifications, thresholds, disclosure flags, warnings, and narrative"
    depends_on: []

  - name: budget_variance_output
    description: >
      Budget variance analysis with materiality filtering and department/category
      breakdown. Favorable/unfavorable classification per line item.
    fidelity:
      headline: "Revenue variance $X (Y% fav/unfav), N material variances"
      summary: "Revenue and expense variance summary, material variance count by dept"
      full: "All line-item variances, department summary, category summary, exec summary"
    depends_on: []
    deprecated_at_pr: "2.5"

  - name: business_investment_output
    description: >
      Business investment analysis: ROI, payback, NPV, IRR, scoring rubric, and
      base/upside/downside scenario comparison.
    fidelity:
      headline: "ROI X%, NPV $Y, IRR Z% -- verdict: <scoring verdict>"
      summary: "Summary metrics: ROI, payback, NPV, IRR, scoring total, verdict"
      full: "Full scoring rubric, all three scenarios, flags list"
    depends_on: []
    deprecated_at_pr: "2.5"

  - name: forecast_output
    description: >
      Driver-based revenue forecast with trend analysis, scenario modeling
      (base/bull/bear), and 13-week rolling cash flow projection.
    fidelity:
      headline: "Base case revenue $X over N periods (Y% growth)"
      summary: "Trend direction, scenario comparison table, cash runway"
      full: "Full period-by-period forecast for all scenarios plus rolling cash flow"
    depends_on: []

  - name: workbook_artifact
    description: >
      Raw xlsx workbook bytes built from one or more named sheets.
      Produced by excel_builder; intended for download attachment alongside prose reports.
    fidelity:
      headline: "Excel workbook: N sheets"
      summary: "Sheet list with row counts and column headers"
      full: "Full workbook (raw xlsx bytes, base64-encoded for transport)"
    depends_on: []

  # -----------------------------------------------------------------------
  # Sector module outputs (Wave 1, PR 3.x)
  # -----------------------------------------------------------------------

  - name: banks_sector_panel_output
    description: >
      Institutional bank KPI panel covering five metric blocks: profitability
      (NIM, RoTCE, ROA, ROE, efficiency ratio, fee income mix), capital adequacy
      (CET1, Tier 1, Total Capital, leverage ratio, buffer vs regulatory minimum),
      credit quality (NCO rate, NPL ratio, ACL coverage ratio, LLP build/release),
      liquidity (loan-to-deposit ratio, wholesale funding mix, deposit cost),
      credit-cycle phase classification, composite bank health score (0-100),
      warnings (CET1 within 100bps of minimum, NCO surge), and narrative.
      Mandatory for any Banks-sector initiation or quarterly update report.
    fidelity:
      headline: "Bank panel: NIM X%, RoTCE Y%, CET1 Z% (buffer: W), NCO: V%"
      summary: "NIM, RoTCE, efficiency ratio, CET1 buffer adequacy, NCO rate, cycle phase, health score"
      full: "All five metric blocks (profitability, capital, credit, liquidity, cycle), health score, warnings, narrative"
    depends_on: []

  - name: reit_valuation_panel_output
    description: >
      REIT KPI and valuation panel covering four metric blocks: income
      (FFO, AFFO, AFFO payout ratio, FFO/AFFO QoQ and YoY growth),
      valuation (P/FFO, P/AFFO, NAV per share, applied cap rate,
      implied cap rate, premium/discount to NAV),
      operating metrics (same-store NOI growth, occupancy rate, WALT,
      re-leasing spreads, tenant concentration, lease expiry ladder),
      and balance sheet (Net Debt/EBITDA, debt-to-assets, unsecured debt mix,
      interest coverage, weighted average debt maturity).
      Also produces AFFO sustainability score, composite REIT health score (0-100),
      and warnings (AFFO payout > 80%, Net Debt/EBITDA > 7x, occupancy < 90%).
      Mandatory for any equity REIT or REOC initiation or quarterly update report.
      NAV calculation requires user-supplied cap rate assumptions.
    fidelity:
      headline: "REIT panel: FFO/sh $X, AFFO payout Y%, NAV $Z/sh (W% discount/premium)"
      summary: "FFO, AFFO, payout ratio, NAV/share, premium/discount to NAV, SS NOI growth, occupancy, Net Debt/EBITDA, health score"
      full: "All four metric blocks (income, valuation, operating, balance sheet), sustainability score, health score, warnings, narrative"
    depends_on: []

  - name: rnpv_pipeline_output
    description: >
      Pharma/biotech pipeline rNPV engine output covering per-asset risk-adjusted NPV
      components: unrisked NPV, risked NPV (x PoS), royalty burden owed to licensors,
      net NPV, peak sales year, and patent cliff impact.
      Aggregates to total pipeline value, top-3 value concentration metrics,
      optional platform value, warnings (binary event risk, negative rNPV assets),
      and narrative.
      Probability-of-success (PoS) values are user-supplied per execution-strategy
      decision #5 — no built-in Citeline lookup table ships in-repo.
      Mandatory for any pharma/biotech where pipeline assets represent >25% of value.
    fidelity:
      headline: "Pipeline rNPV: $X total; top asset Y% concentration; N assets"
      summary: "Per-asset risked NPV, total pipeline value, top-1/top-3 concentration, binary risk warnings"
      full: "All per-asset components (unrisked/risked NPV, royalty burden, cliff impact), concentration table, platform value, warnings, narrative"
    depends_on: []

  - name: ep_sector_panel_output
    description: >
      E&P sector KPI panel covering five metric blocks: production (BOE/d, oil/gas/NGL mix,
      YoY growth), per-unit economics (realized price, royalties, lifting costs, gathering,
      G&A, netback per BOE, AISC per BOE), cash flow (EBITDAX, DACF, EBITDA, FCF),
      capital efficiency (F&D cost per BOE, recycle ratio, reinvestment rate, maintenance FCF),
      reserves (proved 1P, proved-developed %, RLI, organic RRR, total RRR, reserve additions),
      balance sheet (Net Debt/EBITDAX, Net Debt/DACF), scenario economics (breakeven oil price,
      FCF at $60/$80/$100), optional hedging block, composite E&P health score (0-100),
      cycle phase (late_cycle/mid_cycle/early_cycle/trough), and warnings (negative netback,
      organic RRR < 100%, Net Debt/EBITDAX > 2x, AISC > $50/BOE).
      Mandatory for any oil/gas E&P initiation or quarterly update report.
    fidelity:
      headline: "E&P panel: netback $X/BOE, DACF $Y, organic RRR Z%, Net Debt/EBITDAX W"
      summary: "Netback/BOE, AISC/BOE, DACF, recycle ratio, organic RRR, RLI, Net Debt/EBITDAX, health score"
      full: "All five metric blocks (production, per-unit, cash flow, reserves, balance sheet), scenario economics, hedging, health score, cycle phase, warnings, narrative"
    depends_on: []

  - name: insurance_valuation_panel_output
    description: >
      Insurance KPI panel covering P&C and/or Life sub-blocks depending on segment mix.
      P&C block: premiums written/earned, premium growth YoY, loss ratio, expense ratio,
      policyholder dividend ratio, combined ratio, combined ratio ex-cat, prior-year reserve
      development (favorable vs adverse), underwriting profit/loss, catastrophe load %,
      reinsurance dependence note.
      Life block: gross/net premiums, benefits and claims paid, change in reserves,
      embedded value (disclosed), value of in-force (VIF), new business value (VNB),
      VNB margin (NBV / APE), EV per share, price-to-EV, solvency ratio, persistency rate.
      Cross-cutting: investment portfolio (invested assets, investment yield, realized gains),
      balance sheet (GAAP BVPS, tangible BVPS, TBVPS growth, P/TBV, P/BV), ROE,
      float metrics (float/equity ratio, float generation cost for P&C),
      capital adequacy (RBC ratio, Solvency II SCR coverage, BCAR rating),
      composite insurance health score (0-100), underwriting cycle phase
      (hardening/softening/stable), and warnings (combined ratio > 100%, adverse reserve
      development, solvency below 150%, negative GAAP equity).
      Mandatory for any Insurance-sector initiation or quarterly update report.
    fidelity:
      headline: "Insurance panel: combined ratio X% (P&C) / VNB margin Y% (Life), ROE Z%, health score W"
      summary: "Combined ratio, loss/expense ratios, investment yield, BVPS GAAP/tangible, ROE, solvency, health score"
      full: "All sub-blocks (pc, life, investment portfolio, balance sheet, float metrics, capital adequacy), cycle phase, health score, warnings, narrative"
    depends_on: []

  # -----------------------------------------------------------------------
  # EODHD adapter outputs (18 helpers, PR 1.1)
  # -----------------------------------------------------------------------

  - name: eodhd_fundamentals_output
    description: >
      Full fundamentals snapshot from EODHD: general company info, earnings history,
      financials (balance sheet, income statement, cash flow), highlights, valuation,
      and analyst ratings for a single ticker.
    fidelity:
      headline: "Ticker fundamentals snapshot (market cap, PE, EPS, sector)"
      summary: "Key highlights: market cap, P/E, EPS, revenue, profit margin, analyst rating"
      full: "Complete fundamentals JSON: General, Highlights, Valuation, Financials, Earnings"
    depends_on: []

  - name: eodhd_balance_sheet_output
    description: >
      Quarterly and/or annual balance sheet time series from EODHD for a single ticker.
      Includes assets, liabilities, equity line items per period.
    fidelity:
      headline: "Balance sheet: latest total assets, total liabilities, equity"
      summary: "Last 4 quarters: total assets, total liabilities, total equity"
      full: "Full quarterly and annual balance sheet series with all line items"
    depends_on: []

  - name: eodhd_income_statement_output
    description: >
      Quarterly and/or annual income statement time series from EODHD for a single ticker.
      Includes revenue, gross profit, operating income, net income, EPS per period.
    fidelity:
      headline: "Income statement: latest revenue, net income, EPS"
      summary: "Last 4 quarters: revenue, gross profit, operating income, net income"
      full: "Full quarterly and annual income statement series with all line items"
    depends_on: []

  - name: eodhd_cash_flow_output
    description: >
      Quarterly and/or annual cash flow statement time series from EODHD for a single ticker.
      Includes operating, investing, financing cash flows and free cash flow per period.
    fidelity:
      headline: "Cash flow: latest operating CF, free CF"
      summary: "Last 4 quarters: operating CF, investing CF, financing CF, free CF"
      full: "Full quarterly and annual cash flow series with all line items"
    depends_on: []

  - name: eodhd_eod_prices_output
    description: >
      End-of-day OHLCV price series from EODHD for a single ticker over a date range.
      Includes open, high, low, close, adjusted close, and volume per trading day.
    fidelity:
