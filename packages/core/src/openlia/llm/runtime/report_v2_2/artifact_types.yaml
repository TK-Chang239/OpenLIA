      full: "Full year-by-year ladder, instrument names per bucket, WAM, WAC, wall detection, stress test, warnings"
    depends_on: []

  # -----------------------------------------------------------------------
  # Signals helpers (PR 2.8)
  # -----------------------------------------------------------------------

  - name: insider_signal_output
    description: >
      Insider trading signal derived from SEC Form 4 transactions. Filters out
      compensation-related codes (A/M/F/G/C/D/X); aggregates only discretionary
      open-market buys (P) and sells (S) over configurable lookback windows
      (default 90d / 180d / 365d). Detects cluster buying (>=3 distinct insiders
      in 30 days), role-weights net activity (CEO/CFO > Director), and classifies
      signal direction (bullish / mildly_bullish / neutral / mildly_bearish / bearish)
      with confidence (high / moderate / low).
    fidelity:
      headline: "Insider signal: classification X, confidence Y, cluster detected Z"
      summary: "90d window: buy count, sell count, net value, cluster flag, signal classification"
      full: "All windows (90d/180d/365d): buy/sell aggregates, role-weighted net value, largest buy, excluded code counts, signal classification and confidence"
    depends_on:
      - eodhd_insider_transactions_output

  - name: moving_average_panel_output
    description: >
      Moving average trend panel derived from split-adjusted price (or multiple) series.
      Computes SMA/EMA for configurable windows (default 20/50/100/200); price-vs-MA
      position (% above/below); MA slope and slope state (rising/flattening/falling);
      golden cross / death cross detection for (50/200) and (20/50) pairs with date,
      return-since-cross, and optional volume confirmation; 200-day stretch z-score;
      MA stack (bullish/bearish/mixed); and trend regime (uptrend/downtrend/range).
      Works on price series or valuation multiple series (series_kind="multiple").
    fidelity:
      headline: "MA panel: trend regime X, 200d stretch Y%, golden/death cross Z"
      summary: "Current price vs 50/200-day MA, trend regime, most recent crossover, 200d stretch pct"
      full: "All MA windows with value/pct/slope; crossovers with date/return/volume confirmation; 200d z-score; narrative"
    depends_on:
      - eodhd_eod_prices_output

  - name: historical_multiple_trends_output
    description: >
      Historical valuation multiple trends over 1Y/3Y/5Y/10Y windows for P/E, P/S,
      EV/EBITDA, and P/B. Per multiple: min/p25/median/mean/p75/max/stdev; current
      percentile rank vs own history; z-score vs window mean; vs-median-pct deviation;
      OLS re-rating / de-rating trend; < 10th or > 90th percentile warnings; optional
      sector premium/discount overlay; optional forward/trailing spread with implied
      growth read. NM (loss) periods flagged and excluded from P/E stats.
    fidelity:
      headline: "Multiple trends: P/E at Xth percentile of 5Y history, trend: Y"
      summary: "Per multiple: current, 5Y percentile, z-score, re-rating trend direction"
      full: "All multiples with full stats by window, percentile ranks, z-scores, sector overlay, forward/trailing spread, NM flags, warnings"
    depends_on:
      - eodhd_market_cap_history_output

  # -----------------------------------------------------------------------
  # Output bundle helpers (PR 2.10)
  # -----------------------------------------------------------------------

  - name: waterfall_chart_output
    description: >
      Multi-step bridge (waterfall) chart visualizing how a starting value
      is built up or torn down through a series of labeled driver deltas to
      reach an ending value. Classic uses: revenue bridge, EPS walk, NI
      decomposition. Produces Plotly JSON chart and a markdown table with
      cumulative running totals.
    fidelity:
      headline: "Waterfall bridge: starting X -> ending Y (total change Z, N drivers)"
      summary: "Starting value, ending value, total change %, positive driver count, negative driver count, markdown table"
      full: "Full Plotly JSON chart, markdown table with all steps and running totals, positive/negative driver breakdown"
    depends_on: []

  # -----------------------------------------------------------------------
  # Risk / macro helpers (PR 2.11)
  # -----------------------------------------------------------------------

  - name: drawdown_panel_output
    description: >
      Per-window drawdown statistics over 1Y/3Y/5Y/10Y/since-IPO horizons.
      Includes max drawdown (depth, peak date, trough date, duration days),
      recovery date and recovery duration, current drawdown, underwater curve
      (% below peak over time), Calmar ratio (annualized return / max drawdown),
      Sortino ratio (excess return / downside deviation), and a list of all
      historical drawdowns exceeding 10% with their peak-trough-recovery triplets.
    fidelity:
      headline: "Drawdown panel: max DD X% over 3Y, current DD Y%, Calmar Z"
      summary: "Max drawdown by window, current drawdown, recovery status, Calmar and Sortino ratios"
      full: "Full per-window stats, underwater curve series, all drawdowns >10%, Calmar/Sortino by window, peak/trough/recovery dates"
    depends_on:
      - eodhd_eod_prices_output

  - name: yield_curve_shape_output
    description: >
      Key yield-curve shape signals derived from UST rates. Includes 10Y-2Y spread,
      10Y-3M spread (NY Fed recession signal), 5Y-2Y spread, 30Y-10Y spread,
      inversion flag, days since last inversion, OLS slope across the curve (bps/year),
      curvature score (belly shape), regime classification (steep / modestly upward /
      flat / inverted), and historical comparison vs 1Y-ago and 5Y-ago snapshots.
    fidelity:
      headline: "Yield curve: regime X, 10Y-2Y spread Y bps, inverted: Z"
      summary: "Key spreads (10Y-2Y, 10Y-3M), inversion flag, days since inversion, regime label"
      full: "All spreads, slope, curvature, regime, historical snapshots, days-since-inversion, classification rationale"
    depends_on: []

  - name: commodity_exposure_output
    description: >
      Commodity exposure and sensitivity analysis linking company revenue or margin
      to a commodity price series. Includes Pearson and Spearman correlation,
      lagged correlation (lags 0-4 quarters with argmax), OLS regression slope,
      and a plain-English interpretation of the relationship. Designed for energy,
      materials, agricultural, and industrials companies with commodity-driven revenues.
    fidelity:
      headline: "Commodity exposure: Pearson r=X with Y, lag Z quarters"
      summary: "Pearson/Spearman correlation, regression slope, argmax lag, one-line interpretation"
      full: "Full correlation table by lag, regression output, sensitivity interpretation, commodity name and units"
    depends_on: []

  # -----------------------------------------------------------------------
  # statsmodels regression helpers (PR 4.1)
  # -----------------------------------------------------------------------

  - name: ols_regression_output
    description: >
      OLS (or OLS with Newey-West HAC) regression result: per-variable coefficients,
      standard errors, t-statistics, p-values, R², adjusted R², F-statistic,
      F p-value, residuals series, fitted values series, and method label.
    fidelity:
      headline: "OLS: R²=X, F-stat=Y (p=Z), N obs"
      summary: "Coefficients table (name, coef, SE, t-stat, p-value), R², adj-R², F-stat"
      full: "Full regression output: all coefficients, SEs, t-stats, p-values, R², adj-R², F-stat, residuals, fitted values, method"
    depends_on: []

  - name: stationarity_test_output
    description: >
      ADF and KPSS stationarity test results for a univariate time series.
      Includes test statistics, p-values, lag counts, critical values, individual
      verdicts, and a consensus stationarity classification (stationary /
      non_stationary / inconclusive).
    fidelity:
      headline: "Stationarity: consensus=X, ADF p=Y, KPSS p=Z"
      summary: "ADF (stat, p-value, verdict) + KPSS (stat, p-value, verdict) + consensus"
      full: "ADF and KPSS full output including lags used, critical values at 1%/5%/10%, verdicts, consensus, alpha"
    depends_on: []

  - name: autocorrelation_output
    description: >
      ACF and PACF series plus Ljung-Box portmanteau test and Durbin-Watson
      statistic for a univariate time series. Includes autocorrelation
      classification (none / mild / moderate / strong / decaying / oscillating).
    fidelity:
      headline: "Autocorrelation: LB p=X, classification=Y, DW=Z"
      summary: "Ljung-Box (stat, p-value, verdict), Durbin-Watson, classification, lags"
      full: "Full ACF and PACF series, Ljung-Box details, Durbin-Watson, classification, alpha"
    depends_on: []

  - name: heteroskedasticity_test_output
    description: >
      Breusch-Pagan and White's heteroskedasticity test results for OLS residuals.
      Each test returns LM stat, LM p-value, F-stat, F p-value, and a verdict.
      An overall_verdict flags heteroskedastic if either test rejects H0.
    fidelity:
      headline: "Heteroskedasticity: overall=X, BP p=Y, White p=Z"
      summary: "Breusch-Pagan (stat, p-value, verdict) + White (stat, p-value, verdict) + overall"
      full: "Full BP and White test statistics, p-values (LM and F forms), verdicts, overall verdict, alpha"
    depends_on:
      - ols_regression_output

  - name: garch_volatility_output
    description: >
      GARCH(1,1) conditional volatility model fitted to a returns series.
      Returns estimated parameters (omega, alpha, beta, persistence),
      conditional volatility series, 1-step-ahead (or N-step) forecasted
      volatility, log-likelihood, AIC, BIC, and model summary.
    fidelity:
      headline: "GARCH(1,1): alpha=X, beta=Y, persistence=Z, forecast vol=W"
      summary: "Parameters (omega, alpha, beta, persistence), latest conditional vol, 1-step forecast, AIC/BIC"
      full: "Full parameters, full conditional volatility series, forecasted volatility, log-likelihood, AIC, BIC, model summary"
    depends_on: []

  - name: var_model_output
    description: >
      Vector Autoregression VAR(p) model fitted to a multivariate stationary time
      series. Returns lag order (IC-selected), per-lag coefficient matrices,
      Granger causality matrix (p-values and verdicts for all variable pairs),
      impulse response functions, AIC, BIC, and log-likelihood.
    fidelity:
      headline: "VAR(p=X): N variables, Granger causality summary, AIC=Y"
      summary: "Lag order, variable names, Granger causality matrix (significant pairs), AIC/BIC"
      full: "Full coefficient matrices per lag, complete Granger causality matrix with p-values and verdicts, impulse response functions, AIC, BIC, log-likelihood"
    depends_on: []

  # -----------------------------------------------------------------------
  # NLP / unstructured-source helpers (8 helpers, PR 4.2)
  # -----------------------------------------------------------------------

  - name: pdf_ingest_output
    description: >
      Structured extraction from a PDF document (SEC filing, earnings deck, research report).
      Produced by pdf_ingest using pdfplumber. Contains per-page text, tables as
      list-of-rows, and document metadata (page count, file size, extraction quality).
    fidelity:
      headline: "PDF ingest: N pages, M tables, extraction quality: X"
      summary: "Metadata (page count, file size), section list with page ranges, table count"
      full: "Full per-page text, all tables as list-of-rows, metadata, extraction notes"
    depends_on: []

  - name: transcript_tone_output
    description: >
      LLM-analyzed earnings call transcript tone. Per-speaker tone classification
      (confident/cautious/hedging/defensive for management; constructive/challenging/neutral
      for analysts), prepared-remarks vs Q&A tone differential, hedging language themes,
      forward-looking statement count, and extraction quality self-assessment.
    fidelity:
      headline: "Transcript tone: prepared_remarks=X, QA=Y, differential=Z"
      summary: "Per-speaker tone summary, prepared vs QA differential, hedging themes"
      full: "All speaker entries with tone, evidence quotes, hedging counts, forward-looking counts, themes, quality flag"
    depends_on: []

  - name: tone_shift_qoq_output
    description: >
      QoQ tone shift analysis comparing current and prior quarter transcripts.
      Returns overall shift direction (more cautious / unchanged / more confident),
      per-speaker/topic key shifts with current and prior evidence quotes,
      hedging language change percent, and narrative summary.
    fidelity:
      headline: "QoQ tone shift: overall=X, hedging change=Y%"
      summary: "Overall shift direction, key shifts count, hedging language change pct, narrative"
      full: "Full key_shifts list with speaker role, topic, direction, current and prior evidence; narrative"
    depends_on: []

  - name: mda_extraction_output
    description: >
      Structured extraction of MD&A section from a 10-K or 10-Q filing.
      Identifies key business drivers, headwinds, management outlook statements,
      non-GAAP reconciliation mentions, and per-segment commentary with
      disclosed growth rates.
    fidelity:
      headline: "MD&A: N drivers, M headwinds, segment commentary for K segments"
      summary: "Top drivers, top headwinds, outlook statements, segment list"
      full: "Full drivers list with direction and evidence quotes, headwinds with magnitude, outlook statements, non-GAAP mentions, segment commentary"
    depends_on: []

  - name: risk_factors_extraction_output
    description: >
      Structured extraction and categorization of Item 1A Risk Factors from a 10-K.
      Categorizes risks into operational, financial, governance, macro, regulatory,
      competitive. Flags new risks and removed risks vs prior year, and severity rankings.
    fidelity:
      headline: "Risk factors: N total, categories breakdown, M new this year"
      summary: "Total risk count, categories breakdown, new risks count, removed risks count"
      full: "Full risk list with title, category, text excerpt, first-appeared year, YoY language change flags; category breakdown; new/removed lists"
    depends_on: []

  - name: forward_looking_statements_output
    description: >
      Extracted forward-looking statements from a filing or transcript with hedging
      language analysis. Each statement classified by category (guidance/outlook/
      risk_factor_qualifier/strategic_statement), confidence indicator, qualifiers list,
      time horizon, metric, and value range where disclosed.
    fidelity:
      headline: "Forward-looking: N statements, source=X, confidence distribution"
      summary: "Statement count, source type, category breakdown, confidence distribution"
      full: "Full statement list with text, category, confidence indicator, qualifiers, time horizon, metric, value range"
    depends_on: []

  - name: guidance_tracker_output
    description: >
      Management guidance vs actuals track record over up to 8 quarters.
      Per-quarter verdict (beat_modest/beat_large/within_range/miss) with guidance
      range and actual results. Summary with beat rate, miss rate, average revenue
      surprise percent, guidance accuracy heuristic, and narrative.
    fidelity:
      headline: "Guidance track record: beat_rate=X%, miss_rate=Y%, accuracy_heuristic=Z"
      summary: "Quarters analyzed, beat/within/miss rates, avg revenue surprise pct, accuracy heuristic"
      full: "Full per-quarter guidance_track_record with guidance ranges, actuals, verdicts; summary with narrative"
    depends_on: []

  - name: customer_concentration_output
    description: >
      Customer concentration disclosures extracted from 10-K Item 1 and Item 14.
      Top customer percent of revenue, top-3 and top-10 customer percentages,
      named customers where disclosed, geographic and industry concentration,
      source quote, and risk framing (low/moderate/high).
    fidelity:
      headline: "Customer concentration: top_customer=X%, risk_framing=Y"
      summary: "Top customer %, top-3 %, named customers, geographic concentration, risk framing"
      full: "Full disclosure: top customer, top-3, top-10, named customers, geographic breakdown, industry breakdown, source quote, risk framing"
    depends_on: []
