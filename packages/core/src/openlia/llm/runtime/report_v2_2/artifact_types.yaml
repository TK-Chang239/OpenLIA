# Artifact type registry — seed for v2.2 report engine.
# Each entry declares fidelity descriptions and DAG dependencies.
# 4 Stage-7a core types (landing in PR 0.3) + 8 helper-produced types (migrated in PR 0.2).
#
# IMPORTANT: depends_on lists ArtifactType names that MUST be produced before
# this type can be consumed. Boot-time DAG validation enforces no cycles.
#
# deprecated_at_pr: set on types scheduled for removal in a future PR.
# This key is for tracking only — the L2 projection does NOT surface it to the LLM.

artifact_types:

  # -----------------------------------------------------------------------
  # Stage-7a core types (PR 0.3)
  # -----------------------------------------------------------------------

  - name: section_plan
    description: >
      Structured plan mapping report sections to artifact IDs and fidelity levels.
      Produced by Stage 5 planner; consumed by Stage 7a materialization.
    fidelity:
      headline: "One-line summary of section layout (N sections, M artifacts)"
      summary: "Section list with artifact IDs and requested fidelity levels"
      full: "Complete ReportSectionPlan JSON including overrides_applied"
    depends_on: []

  - name: materialized_section
    description: >
      Rendered markdown for a single report section after fidelity projection and
      deduplication. Produced by Stage 7a; consumed by Stage 7b drafter.
    fidelity:
      headline: "Section title + one-sentence summary of rendered content"
      summary: "Section title + first artifact headline + artifact count"
      full: "Full rendered section markdown with all artifact renders at resolved fidelity"
    depends_on:
      - section_plan

  - name: fidelity_hint
    description: >
      Planner-emitted advisory specifying preferred fidelity for a named artifact
      in the current run. Overrides template defaults when present.
    fidelity:
      headline: "Artifact ID + fidelity level override"
      summary: "Artifact ID + fidelity + rationale note"
      full: "Full SectionPlanOverride record with rationale"
    depends_on:
      - section_plan

  - name: rendered_artifact
    description: >
      Markdown-rendered form of any helper-produced artifact at a specific fidelity.
      The Stage-7a output atom that Stage-7b consumes.
    fidelity:
      headline: "One-liner with the key number from the artifact"
      summary: "Compact table or chart caption (~200-400 tokens)"
      full: "Complete artifact markdown (~800-2000 tokens)"
    depends_on: []

  # -----------------------------------------------------------------------
  # Helper-produced artifact types (8 helpers migrated in PR 0.2)
  # -----------------------------------------------------------------------

  - name: dcf_valuation_output
    description: >
      Full DCF valuation result: WACC, projected FCF schedule, terminal value
      (perpetuity and exit-multiple methods), enterprise and equity value, per-share
      value, and 2-D sensitivity table over WACC x terminal growth.
    fidelity:
      headline: "DCF fair value = $X (perpetuity) / $Y (exit multiple)"
      summary: "WACC, terminal growth, EV and equity value per method, implied price range"
      full: "Complete FCF schedule, terminal value decomposition, sensitivity grid"
    depends_on: []

  - name: chart_artifact
    description: >
      Inline SVG chart (line, bar, scatter, or heatmap) rendered by matplotlib.
      General-purpose visual; consumed by any section that needs a chart embed.
    fidelity:
      headline: "Chart title and type (e.g. 'Revenue trend -- line chart')"
      summary: "Chart title, axes labels, and data range summary"
      full: "Inline SVG content (base64 or raw SVG string)"
    depends_on: []

  - name: ratio_panel
    description: >
      Financial ratios across profitability, liquidity, leverage, efficiency, and
      valuation categories with benchmark interpretation.
    fidelity:
      headline: "Key ratios summary: ROE X%, gross margin Y%, D/E Z"
      summary: "Profitability + liquidity + valuation ratios table with benchmark flags"
      full: "All five ratio categories with values, formulas, and interpretations"
    depends_on: []
    deprecated_at_pr: "2.5"

  - name: saas_metrics_output
    description: >
      SaaS unit economics: MRR/ARR, ARPA, churn, CAC, LTV, LTV:CAC, payback,
      NRR, Rule of 40. Supports metrics, quick-ratio, and simulation modes.
    fidelity:
      headline: "ARR $X, NRR Y%, LTV:CAC Z -- Rule of 40: W"
      summary: "Core SaaS KPIs table: ARR, churn, CAC, LTV, NRR, Rule of 40"
      full: "Full SaaS metrics with quick ratio breakdown and unit economics simulation"
    depends_on: []
    deprecated_at_pr: "2.9"

  - name: budget_variance_output
    description: >
      Budget variance analysis with materiality filtering and department/category
      breakdown. Favorable/unfavorable classification per line item.
    fidelity:
      headline: "Revenue variance $X (Y% fav/unfav), N material variances"
      summary: "Revenue and expense variance summary, material variance count by dept"
      full: "All line-item variances, department summary, category summary, exec summary"
    depends_on: []
    deprecated_at_pr: "2.5"

  - name: business_investment_output
    description: >
      Business investment analysis: ROI, payback, NPV, IRR, scoring rubric, and
      base/upside/downside scenario comparison.
    fidelity:
      headline: "ROI X%, NPV $Y, IRR Z% -- verdict: <scoring verdict>"
      summary: "Summary metrics: ROI, payback, NPV, IRR, scoring total, verdict"
      full: "Full scoring rubric, all three scenarios, flags list"
    depends_on: []
    deprecated_at_pr: "2.5"

  - name: forecast_output
    description: >
      Driver-based revenue forecast with trend analysis, scenario modeling
      (base/bull/bear), and 13-week rolling cash flow projection.
    fidelity:
      headline: "Base case revenue $X over N periods (Y% growth)"
      summary: "Trend direction, scenario comparison table, cash runway"
      full: "Full period-by-period forecast for all scenarios plus rolling cash flow"
    depends_on: []

  - name: workbook_artifact
    description: >
      Raw xlsx workbook bytes built from one or more named sheets.
      Produced by excel_builder; intended for download attachment alongside prose reports.
    fidelity:
      headline: "Excel workbook: N sheets"
      summary: "Sheet list with row counts and column headers"
      full: "Full workbook (raw xlsx bytes, base64-encoded for transport)"
    depends_on: []

  # -----------------------------------------------------------------------
  # EODHD adapter outputs (18 helpers, PR 1.1)
  # -----------------------------------------------------------------------

  - name: eodhd_fundamentals_output
    description: >
      Full fundamentals snapshot from EODHD: general company info, earnings history,
      financials (balance sheet, income statement, cash flow), highlights, valuation,
      and analyst ratings for a single ticker.
    fidelity:
      headline: "Ticker fundamentals snapshot (market cap, PE, EPS, sector)"
      summary: "Key highlights: market cap, P/E, EPS, revenue, profit margin, analyst rating"
      full: "Complete fundamentals JSON: General, Highlights, Valuation, Financials, Earnings"
    depends_on: []

  - name: eodhd_balance_sheet_output
    description: >
      Quarterly and/or annual balance sheet time series from EODHD for a single ticker.
      Includes assets, liabilities, equity line items per period.
    fidelity:
      headline: "Balance sheet: latest total assets, total liabilities, equity"
      summary: "Last 4 quarters: total assets, total liabilities, total equity"
      full: "Full quarterly and annual balance sheet series with all line items"
    depends_on: []

  - name: eodhd_income_statement_output
    description: >
      Quarterly and/or annual income statement time series from EODHD for a single ticker.
      Includes revenue, gross profit, operating income, net income, EPS per period.
    fidelity:
      headline: "Income statement: latest revenue, net income, EPS"
      summary: "Last 4 quarters: revenue, gross profit, operating income, net income"
      full: "Full quarterly and annual income statement series with all line items"
    depends_on: []

  - name: eodhd_cash_flow_output
    description: >
      Quarterly and/or annual cash flow statement time series from EODHD for a single ticker.
      Includes operating, investing, financing cash flows and free cash flow per period.
    fidelity:
      headline: "Cash flow: latest operating CF, free CF"
      summary: "Last 4 quarters: operating CF, investing CF, financing CF, free CF"
      full: "Full quarterly and annual cash flow series with all line items"
    depends_on: []

  - name: eodhd_eod_prices_output
    description: >
      End-of-day OHLCV price series from EODHD for a single ticker over a date range.
      Includes open, high, low, close, adjusted close, and volume per trading day.
    fidelity:
      headline: "EOD prices: date range, latest close, N trading days"
      summary: "First and last date, latest close, adjusted close, average volume"
      full: "Full OHLCV series with adjusted close per trading day"
    depends_on: []

  - name: eodhd_intraday_output
    description: >
      Intraday OHLCV price series from EODHD for a single ticker at 1m, 5m, or 1h intervals.
    fidelity:
      headline: "Intraday prices: interval, date range, N bars"
      summary: "Interval, date range, latest bar OHLCV"
      full: "Full intraday OHLCV series for the requested interval and period"
    depends_on: []

  - name: eodhd_real_time_quote_output
    description: >
      Live or last-trade quote from EODHD for a single ticker.
      Includes last price, open, high, low, volume, change, and percent change.
    fidelity:
      headline: "Live quote: last price, change %, volume"
      summary: "Last price, open, high, low, volume, change, percent change"
      full: "Full live quote record with all fields"
    depends_on: []

  - name: eodhd_dividends_output
    description: >
      Historical dividend payment history from EODHD for a single ticker.
      Includes payment date, declaration date, record date, ex-dividend date, and amount.
    fidelity:
      headline: "Dividends: N payments, latest dividend $X"
      summary: "Last 4 dividend payments: date, amount, currency"
      full: "Full dividend history with all dates and amounts"
    depends_on: []

  - name: eodhd_splits_output
    description: >
      Historical stock split history from EODHD for a single ticker.
      Includes split date and split ratio.
    fidelity:
      headline: "Splits: N splits, latest ratio X:Y"
      summary: "All splits: date and ratio"
      full: "Full split history with dates and ratios"
    depends_on: []

  - name: eodhd_market_cap_history_output
    description: >
      Historical market capitalization series from EODHD for a single ticker.
      Daily or monthly market cap in USD over a date range.
    fidelity:
      headline: "Market cap history: latest $X, date range"
      summary: "Latest, min, max market cap over the period"
      full: "Full daily market cap series over the requested date range"
    depends_on: []

  - name: eodhd_insider_transactions_output
    description: >
      Insider trading transactions from EODHD for a single ticker.
      Includes transaction date, insider name, transaction type, shares, and value.
    fidelity:
      headline: "Insider transactions: N trades, latest transaction type"
      summary: "Last 5 insider transactions: date, insider, type, shares, value"
      full: "Full insider transaction history for the ticker"
    depends_on: []

  - name: eodhd_news_output
    description: >
      Recent financial news articles from EODHD for a single ticker.
      Includes title, link, publication date, and summary text.
    fidelity:
      headline: "News: N articles, latest headline"
      summary: "Last 5 article titles and dates"
      full: "Full article list with titles, dates, links, and summaries"
    depends_on: []

  - name: eodhd_sentiment_output
    description: >
      Sentiment scores from EODHD for a single ticker over a date range.
      Includes normalized sentiment score and count per date.
    fidelity:
      headline: "Sentiment: latest score, N-day trend direction"
      summary: "Last 5 sentiment scores with dates"
      full: "Full sentiment series over the requested date range"
    depends_on: []

  - name: eodhd_company_info_output
    description: >
      Company profile and general information from EODHD for a single ticker.
      Includes name, description, sector, industry, exchange, country, and employee count.
    fidelity:
      headline: "Company: name, sector, exchange, country"
      summary: "Name, description excerpt, sector, industry, exchange, country, employees"
      full: "Full company profile including address, fiscal year end, IPO date"
    depends_on: []

  - name: eodhd_earnings_history_output
    description: >
      Historical EPS/earnings actuals and estimates from EODHD for a single ticker.
      Includes report date, EPS actual, EPS estimate, and surprise per quarter.
    fidelity:
      headline: "Earnings history: latest EPS actual vs estimate, surprise %"
      summary: "Last 4 quarters: report date, EPS actual, estimate, surprise"
      full: "Full earnings history with all quarterly actuals and estimates"
    depends_on: []

  - name: eodhd_upcoming_earnings_output
    description: >
      Upcoming earnings calendar from EODHD for a single ticker or date range.
      Includes ticker, report date, EPS estimate, and revenue estimate.
    fidelity:
      headline: "Upcoming earnings: next report date, EPS estimate"
      summary: "Next N earnings events: ticker, date, EPS estimate, revenue estimate"
      full: "Full upcoming earnings calendar for the ticker or date range"
    depends_on: []

  - name: eodhd_technical_indicators_output
    description: >
      Technical indicator values from EODHD for a single ticker and function (SMA, EMA, RSI, MACD, etc.).
      Returns a time series of indicator values for the requested period.
    fidelity:
      headline: "Technical indicator: function, period, latest value"
      summary: "Last 5 indicator values with dates"
      full: "Full indicator time series over the requested date range"
    depends_on: []

  - name: eodhd_macro_indicator_output
    description: >
      Macroeconomic indicator series from EODHD for a country (GDP, CPI, unemployment, etc.).
      Returns annual or quarterly time series of the requested indicator.
    fidelity:
      headline: "Macro indicator: country, indicator, latest value and year"
      summary: "Last 5 data points: date, value"
      full: "Full macro indicator time series for the country and indicator"
    depends_on: []

  # -----------------------------------------------------------------------
  # FinanceToolkit ratio helpers (15 helpers, PR 1.2)
  # -----------------------------------------------------------------------

  - name: ft_liquidity_ratios_output
    description: >
      Liquidity ratios computed by FinanceToolkit: current ratio, quick ratio, cash ratio,
      working capital, operating cash flow ratio, and short-term coverage ratio.
    fidelity:
      headline: "Liquidity: current ratio X, quick ratio Y, cash ratio Z"
      summary: "Current, quick, cash ratios plus working capital"
      full: "All six liquidity ratios with working capital dollar value"
    depends_on: []

  - name: ft_solvency_ratios_output
    description: >
      Solvency and leverage ratios computed by FinanceToolkit: debt-to-equity,
      debt-to-assets, interest coverage, equity multiplier, net debt/EBITDA,
      capex coverage, and FCF yield.
    fidelity:
      headline: "Solvency: D/E X, interest coverage Y, net debt/EBITDA Z"
      summary: "D/E, D/A, interest coverage, equity multiplier, net debt/EBITDA"
      full: "All seven solvency ratios including capex coverage and FCF yield"
    depends_on: []

  - name: ft_profitability_ratios_output
    description: >
      Profitability ratios computed by FinanceToolkit: gross/operating/net margins,
      ROA, ROE, ROIC, EBIT/revenue, effective tax rate, income quality, and FCF/OCF ratio.
    fidelity:
      headline: "Profitability: gross margin X%, operating margin Y%, ROE Z%"
      summary: "Gross margin, operating margin, net margin, ROA, ROE"
      full: "All ten profitability ratios including ROIC, tax rate, income quality"
    depends_on: []

  - name: ft_efficiency_ratios_output
    description: >
      Operational efficiency ratios computed by FinanceToolkit: asset turnover,
      inventory turnover, receivables turnover, days outstanding metrics,
      cash conversion cycle, and SG&A/revenue.
    fidelity:
      headline: "Efficiency: asset turnover X, CCC Y days, DSO Z days"
      summary: "Asset turnover, inventory turnover, DSO, DIO, DPO, CCC"
      full: "All twelve efficiency ratios including operating cycle and SG&A/revenue"
    depends_on: []

  - name: ft_valuation_ratios_output
    description: >
      Market valuation multiples computed by FinanceToolkit: market cap, EV, EPS, BVPS,
      P/E, P/B, P/S, EV/EBITDA, EV/EBIT, EV/Sales, P/CF, P/FCF, dividend yield, PEG.
    fidelity:
      headline: "Valuation: P/E X, EV/EBITDA Y, P/B Z"
      summary: "Market cap, EV, P/E, P/B, EV/EBITDA, EV/Sales"
      full: "All fifteen valuation multiples including P/FCF, dividend yield, PEG"
    depends_on: []

  - name: ft_dupont_output
    description: >
      3-step DuPont decomposition computed by FinanceToolkit: net profit margin,
      asset turnover, equity multiplier, and implied ROE.
    fidelity:
      headline: "DuPont ROE: NI margin X% × asset turn Y × equity mult Z = ROE W%"
      summary: "Three DuPont components and resulting ROE"
      full: "Full DuPont table with net profit margin, asset turnover, equity multiplier, ROE"
    depends_on: []

  - name: ft_altman_z_score_output
    description: >
      Altman Z-Score (original 1968 5-factor model) computed by FinanceToolkit.
      Indicates financial distress risk: safe (>2.99), grey zone (1.81-2.99),
      or distress (<1.81).
    fidelity:
      headline: "Altman Z-Score: X (zone: safe/grey/distress)"
      summary: "Z-Score value, zone classification, and five factor ratios"
      full: "Z-Score, zone, all five X1-X5 component ratios, and threshold reference"
    depends_on: []

  - name: ft_piotroski_f_score_output
    description: >
      Piotroski F-Score (0-9 point fundamental quality scale) computed by FinanceToolkit.
      Scores nine binary criteria across profitability, leverage/liquidity, and efficiency.
    fidelity:
      headline: "Piotroski F-Score: X/9 (strength: strong/neutral/weak)"
      summary: "F-Score total and three category sub-scores"
      full: "Full 9-criterion breakdown: profitability (4), leverage/liquidity (3), efficiency (2)"
    depends_on: []

  - name: ft_growth_metrics_output
    description: >
      YoY growth rates for revenue, gross profit, operating income, net income, EPS,
      free cash flow, operating cash flow, and total assets.
    fidelity:
      headline: "Growth: revenue +X% YoY, net income +Y% YoY, FCF +Z% YoY"
      summary: "Revenue, net income, EPS, and FCF YoY growth rates"
      full: "All eight YoY growth rates including gross profit, operating income, total assets"
    depends_on: []

  - name: ft_per_share_metrics_output
    description: >
      Per-share metrics computed by FinanceToolkit: EPS, BVPS, FCF per share,
      dividends per share, OCF per share, revenue per share, capex per share.
    fidelity:
      headline: "Per share: EPS $X, BVPS $Y, FCFPS $Z"
      summary: "EPS, BVPS, FCF per share, dividends per share"
      full: "All eight per-share metrics including OCF/share, revenue/share, capex/share"
    depends_on: []

  - name: ft_cash_flow_metrics_output
    description: >
      Cash flow quality metrics: OCF margin, FCF margin, FCF/OCF ratio, income quality,
      FCF yield, FCFE, capex coverage, and OCF/assets.
    fidelity:
      headline: "Cash flow: OCF margin X%, FCF margin Y%, income quality Z"
      summary: "OCF margin, FCF margin, FCF/OCF ratio, income quality ratio"
      full: "All ten cash flow metrics including FCFE, capex coverage, FCF yield"
    depends_on: []

  - name: ft_dividend_metrics_output
    description: >
      Dividend sustainability metrics: payout ratio, dividend yield, dividend growth,
      FCF payout ratio, OCF payout ratio, and retention ratio.
    fidelity:
      headline: "Dividend: yield X%, payout ratio Y%, FCF coverage Z"
      summary: "Dividend yield, payout ratio, FCF payout ratio, growth"
      full: "All eight dividend metrics including OCF payout and retention ratio"
    depends_on: []

  - name: ft_working_capital_metrics_output
    description: >
      Working capital metrics: NWC, NWC/revenue, non-cash NWC, current ratio,
      days outstanding (DIO, DSO, DPO), operating cycle, CCC, and OCF/NWC.
    fidelity:
      headline: "Working capital: NWC $X, CCC Y days, current ratio Z"
      summary: "NWC, NWC/revenue, DIO, DSO, DPO, CCC"
      full: "All ten working capital metrics including operating cycle and OCF/NWC"
    depends_on: []

  - name: ft_capital_structure_output
    description: >
      Capital structure metrics: D/E, D/A, equity multiplier, WACC, cost of equity
      (CAPM), cost of debt (pre- and after-tax), equity/debt weights, and debt mix.
    fidelity:
      headline: "Capital structure: WACC X%, D/E Y, cost of equity Z%"
      summary: "WACC, cost of equity, cost of debt, D/E, D/A, equity weight"
      full: "Full WACC decomposition with all inputs, debt mix, and interest coverage"
    depends_on: []

  - name: ft_quality_metrics_output
    description: >
      Earnings quality indicators: Sloan accrual ratio, income quality ratio,
      FCF/net income sustainability, OCF margin, ROA trend, capex intensity,
      reinvestment rate, and dilution signal.
    fidelity:
      headline: "Quality: accrual ratio X, income quality Y, FCF/NI Z"
      summary: "Accrual ratio, income quality, FCF/NI, ROA trend direction"
      full: "All ten quality indicators including capex intensity and dilution signal"
    depends_on: []

  # -----------------------------------------------------------------------
  # FRED credit spread helper (PR 1.2)
  # -----------------------------------------------------------------------

  - name: fred_credit_spreads_output
    description: >
      Latest ICE BofA US High Yield OAS, Investment Grade OAS, and 10Y Treasury rate
      fetched from FRED public CSV endpoints. No API key required.
    fidelity:
      headline: "Credit spreads: HY OAS X%, IG OAS Y%, 10Y Tsy Z% as of DATE"
      summary: "HY OAS, IG OAS, 10Y Treasury, HY-IG spread differential"
      full: "All spread values, as-of date, FRED series IDs, and source"
    depends_on: []

  # -----------------------------------------------------------------------
  # Comparables suite (PR 2.1)
  # -----------------------------------------------------------------------

  - name: comparables_output
    description: >
      Comparable companies multiples valuation: peer set, EV bridge, per-multiple
      statistics (P/E, EV/EBITDA, EV/Sales, P/B, P/FCF, PEG, EV/EBIT) for TTM and
      NTM, implied values per multiple, and a blended valuation range across all
      multiples using the p25-to-p75 peer spread applied to the subject company's
      TTM metrics.
    fidelity:
      headline: "Comps blended range: low $X / median $Y / high $Z (N peers, M multiples)"
      summary: "Peer set, EV bridge, key multiples table (P/E, EV/EBITDA, EV/Sales), blended range"
      full: "Full peer panel, EV bridge with warning, all multiples stats, all implied values, blended range"
    depends_on: []

  # -----------------------------------------------------------------------
  # DCF engine + cost of capital + sensitivity bundle (PR 2.2)
  # -----------------------------------------------------------------------

  - name: cost_of_capital_output
    description: >
      Cost of capital decomposition: risk-free rate, equity risk premium, beta,
      cost of equity (CAPM / build-up / Hamada), after-tax cost of debt, capital
      structure weights, and WACC. Consumed by every absolute valuation helper.
    fidelity:
      headline: "WACC X%, cost of equity Y%, after-tax cost of debt Z%"
      summary: "WACC, cost of equity, cost of debt, D/E, method used"
      full: "Full decomposition: rf, ERP, CRP, beta (source, window, R2), size/specific premiums, capital structure, narrative"
    depends_on: []

  - name: dcf_output
    description: >
      Full DCF engine result: FCFF schedule, discount factors, PV per period,
      terminal value (perpetuity / exit multiple / key value driver), enterprise
      value, equity value, implied per-share value, and TV/EV concentration warning.
    fidelity:
      headline: "DCF implied value $X/share (TV = Y% of EV)"
      summary: "EV, equity value, per-share value, TV method and %, WACC, terminal growth"
      full: "Full FCFF schedule, all three TV methods, EV bridge, sensitivity, warnings"
    depends_on:
      - cost_of_capital_output

  - name: sensitivity_matrix
    description: >
      Generic 2-variable sensitivity matrix over any two continuous inputs.
      Contains the base value, axis definitions, and the NxM result grid.
      Used to show how an output changes across a grid of assumption pairs.
    fidelity:
      headline: "Sensitivity matrix: X axis [N values] x Y axis [M values]"
      summary: "Base value, axis ranges, corner and center cell values"
      full: "Full NxM grid as markdown table + Plotly HTML heatmap"
    depends_on: []

  - name: tornado_diagram_output
    description: >
      Single-variable tornado sensitivity: each input is varied from low to high
      while others are held constant; results sorted by impact magnitude descending.
    fidelity:
      headline: "Tornado: top driver X swings $Y low/high (N variables)"
      summary: "Top 5 drivers by impact magnitude with low/high values"
      full: "Full ranked tornado table + Plotly HTML bar chart"
    depends_on: []

  - name: scenario_panel
    description: >
      Probability-weighted scenario analysis: list of named scenarios, each with
      a value and probability. Output is the probability-weighted central value
      plus the full scenario breakdown.
    fidelity:
      headline: "Scenario-weighted value $X (N scenarios, base/bull/bear)"
      summary: "Weighted value, scenario breakdown table"
      full: "Full scenario table: name, value, probability, weight, contribution"
    depends_on: []

  - name: reverse_dcf_output
    description: >
      Reverse DCF: given the current market price, solves for the implied long-term
      growth rate (fixed WACC) or implied WACC (fixed growth). Shows what the market
      is pricing in to justify the current valuation.
    fidelity:
      headline: "Market-implied growth rate X% (or implied WACC Y%) at price $Z"
      summary: "Implied growth/WACC, current price, base WACC/growth, convergence diagnostics"
      full: "Full Newton iteration log, sensitivity around implied value, interpretation"
    depends_on:
      - cost_of_capital_output

  # -----------------------------------------------------------------------
  # Alternative valuation helpers (PR 2.3)
  # -----------------------------------------------------------------------

  - name: ddm_output
    description: >
      Dividend discount model valuation result: selected model variant
      (Gordon, two-stage, three-stage, H-model), per-stage PV breakdown,
      implied equity value per share, sustainability check (sustainable growth gap,
      payout vs. ROE), and optional comparison across all four methods.
    fidelity:
      headline: "DDM implied value $X/share (model: Y, Re=Z%, g=W%)"
      summary: "Model variant, price per share, PV breakdown by stage, sustainability verdict"
      full: "Full stage-by-stage dividend schedule, TV computation, sustainability check, alternative models table"
    depends_on:
      - cost_of_capital_output

  - name: justified_multiples_output
    description: >
      Fundamental-justified trading multiples derived from company ROE, growth,
      payout ratio, and cost of equity: forward P/E, trailing P/E, P/B, and
      EV/EBITDA. Includes per-multiple formula decomposition, actual current
      multiples comparison, and spread (premium/discount vs. fundamentals).
    fidelity:
      headline: "Justified fwd P/E Xx, P/B Yx (vs actual Zx, Wx)"
      summary: "Justified vs. actual multiples table for P/E, P/B, EV/EBITDA with spread %"
      full: "Full justified multiples with formula traces, all spreads, verdict bands, and warnings"
    depends_on:
      - cost_of_capital_output

  - name: sotp_output
    description: >
      Sum-of-the-parts valuation: per-segment EV (EBITDA multiple, P/S, P/B,
      DCF, or user-supplied), segment concentration ratios, corporate overhead
      deduction, optional conglomerate discount, equity bridge (EV minus net debt
      minus minority interest), and implied per-share equity value.
    fidelity:
      headline: "SOTP implied $X/share (N segments, Y% conglomerate discount)"
      summary: "Segment EVs table, overhead deduction, discount, equity bridge, per-share value"
      full: "Full segment detail, concentration warnings, equity bridge, sensitivity to discount assumption"
    depends_on: []
