      vertical line. Also includes a markdown table of the same data.
    fidelity:
      headline: "Football field: N methodologies, current price at X position (median of medians $Y)"
      summary: "Methodologies summary table with ranges; current price position; median of medians"
      full: "Plotly JSON chart, full markdown table, per-methodology detail, verdict"
    depends_on: []

