      full: "All ten quality indicators including capex intensity and dilution signal"
    depends_on: []

  # -----------------------------------------------------------------------
  # FRED credit spread helper (PR 1.2)
  # -----------------------------------------------------------------------

  - name: fred_credit_spreads_output
    description: >
      Latest ICE BofA US High Yield OAS, Investment Grade OAS, and 10Y Treasury rate
      fetched from FRED public CSV endpoints. No API key required.
    fidelity:
      headline: "Credit spreads: HY OAS X%, IG OAS Y%, 10Y Tsy Z% as of DATE"
      summary: "HY OAS, IG OAS, 10Y Treasury, HY-IG spread differential"
      full: "All spread values, as-of date, FRED series IDs, and source"
    depends_on: []

  # -----------------------------------------------------------------------
  # Comparables suite (PR 2.1)
  # -----------------------------------------------------------------------

  - name: comparables_output
    description: >
      Comparable companies multiples valuation: peer set, EV bridge, per-multiple
      statistics (P/E, EV/EBITDA, EV/Sales, P/B, P/FCF, PEG, EV/EBIT) for TTM and
      NTM, implied values per multiple, and a blended valuation range across all
      multiples using the p25-to-p75 peer spread applied to the subject company's
      TTM metrics.
    fidelity:
      headline: "Comps blended range: low $X / median $Y / high $Z (N peers, M multiples)"
      summary: "Peer set, EV bridge, key multiples table (P/E, EV/EBITDA, EV/Sales), blended range"
      full: "Full peer panel, EV bridge with warning, all multiples stats, all implied values, blended range"
    depends_on: []

  # -----------------------------------------------------------------------
  # DCF engine + cost of capital + sensitivity bundle (PR 2.2)
  # -----------------------------------------------------------------------

  - name: cost_of_capital_output
    description: >
      Cost of capital decomposition: risk-free rate, equity risk premium, beta,
      cost of equity (CAPM / build-up / Hamada), after-tax cost of debt, capital
      structure weights, and WACC. Consumed by every absolute valuation helper.
    fidelity:
      headline: "WACC X%, cost of equity Y%, after-tax cost of debt Z%"
      summary: "WACC, cost of equity, cost of debt, D/E, method used"
      full: "Full decomposition: rf, ERP, CRP, beta (source, window, R2), size/specific premiums, capital structure, narrative"
    depends_on: []

  - name: dcf_output
    description: >
      Full DCF engine result: FCFF schedule, discount factors, PV per period,
      terminal value (perpetuity / exit multiple / key value driver), enterprise
      value, equity value, implied per-share value, and TV/EV concentration warning.
    fidelity:
      headline: "DCF implied value $X/share (TV = Y% of EV)"
      summary: "EV, equity value, per-share value, TV method and %, WACC, terminal growth"
      full: "Full FCFF schedule, all three TV methods, EV bridge, sensitivity, warnings"
    depends_on:
      - cost_of_capital_output

  - name: sensitivity_matrix
    description: >
      Generic 2-variable sensitivity matrix over any two continuous inputs.
      Contains the base value, axis definitions, and the NxM result grid.
      Used to show how an output changes across a grid of assumption pairs.
    fidelity:
      headline: "Sensitivity matrix: X axis [N values] x Y axis [M values]"
      summary: "Base value, axis ranges, corner and center cell values"
      full: "Full NxM grid as markdown table + Plotly HTML heatmap"
    depends_on: []

  - name: tornado_diagram_output
    description: >
      Single-variable tornado sensitivity: each input is varied from low to high
      while others are held constant; results sorted by impact magnitude descending.
    fidelity:
      headline: "Tornado: top driver X swings $Y low/high (N variables)"
      summary: "Top 5 drivers by impact magnitude with low/high values"
      full: "Full ranked tornado table + Plotly HTML bar chart"
    depends_on: []

  - name: scenario_panel
    description: >
      Probability-weighted scenario analysis: list of named scenarios, each with
      a value and probability. Output is the probability-weighted central value
      plus the full scenario breakdown.
    fidelity:
      headline: "Scenario-weighted value $X (N scenarios, base/bull/bear)"
      summary: "Weighted value, scenario breakdown table"
      full: "Full scenario table: name, value, probability, weight, contribution"
    depends_on: []

  - name: reverse_dcf_output
    description: >
      Reverse DCF: given the current market price, solves for the implied long-term
      growth rate (fixed WACC) or implied WACC (fixed growth). Shows what the market
      is pricing in to justify the current valuation.
    fidelity:
      headline: "Market-implied growth rate X% (or implied WACC Y%) at price $Z"
      summary: "Implied growth/WACC, current price, base WACC/growth, convergence diagnostics"
      full: "Full Newton iteration log, sensitivity around implied value, interpretation"
    depends_on:
      - cost_of_capital_output

  # -----------------------------------------------------------------------
  # Alternative valuation helpers (PR 2.3)
  # -----------------------------------------------------------------------

  - name: ddm_output
    description: >
      Dividend discount model valuation result: selected model variant
      (Gordon, two-stage, three-stage, H-model), per-stage PV breakdown,
      implied equity value per share, sustainability check (sustainable growth gap,
      payout vs. ROE), and optional comparison across all four methods.
    fidelity:
      headline: "DDM implied value $X/share (model: Y, Re=Z%, g=W%)"
      summary: "Model variant, price per share, PV breakdown by stage, sustainability verdict"
      full: "Full stage-by-stage dividend schedule, TV computation, sustainability check, alternative models table"
    depends_on:
      - cost_of_capital_output

  - name: justified_multiples_output
    description: >
      Fundamental-justified trading multiples derived from company ROE, growth,
      payout ratio, and cost of equity: forward P/E, trailing P/E, P/B, and
      EV/EBITDA. Includes per-multiple formula decomposition, actual current
      multiples comparison, and spread (premium/discount vs. fundamentals).
    fidelity:
      headline: "Justified fwd P/E Xx, P/B Yx (vs actual Zx, Wx)"
      summary: "Justified vs. actual multiples table for P/E, P/B, EV/EBITDA with spread %"
      full: "Full justified multiples with formula traces, all spreads, verdict bands, and warnings"
    depends_on:
      - cost_of_capital_output

  - name: sotp_output
    description: >
      Sum-of-the-parts valuation: per-segment EV (EBITDA multiple, P/S, P/B,
      DCF, or user-supplied), segment concentration ratios, corporate overhead
      deduction, optional conglomerate discount, equity bridge (EV minus net debt
      minus minority interest), and implied per-share equity value.
    fidelity:
      headline: "SOTP implied $X/share (N segments, Y% conglomerate discount)"
      summary: "Segment EVs table, overhead deduction, discount, equity bridge, per-share value"
      full: "Full segment detail, concentration warnings, equity bridge, sensitivity to discount assumption"
    depends_on: []

  # -----------------------------------------------------------------------
  # Decision layer helpers (PR 2.4)
  # -----------------------------------------------------------------------

  - name: price_target_blended
    description: >
      Weighted blend of per-methodology price targets (DCF, DDM, comparables, SOTP).
      Includes blended target, method breakdown with weights, dispersion statistics
      (min/max/stdev/spread%), confidence score, and an explanatory narrative.
    fidelity:
      headline: "Blended PT $X (range $Y–$Z, confidence N)"
      summary: "Blended target, method weights table, dispersion stdev and spread %"
      full: "Full method breakdown, weight audit, dispersion, confidence score, warnings, narrative"
    depends_on: []

  - name: expected_total_return_output
    description: >
      Expected total return (ETR) over a stated horizon: capital return from price
      target, income return from forward dividend yield, combined ETR, annualized ETR.
    fidelity:
      headline: "ETR +X% over N months (cap return +Y%, income +Z%)"
      summary: "Capital return, income return, ETR, annualized ETR, horizon"
      full: "Full decomposition: current price, target, cap return, dividend yield, horizon, annualized"
    depends_on: []

  - name: risk_reward_output
    description: >
      Asymmetric risk/reward profile: upside % to bull case, downside % to bear case,
      R/R ratio, optional probability-weighted expected value, max drawdown,
      asymmetry score, and a verdict band.
    fidelity:
      headline: "R/R X.Xx (upside +Y%, downside Z%)"
      summary: "Upside %, downside %, R/R ratio, expected value, verdict"
      full: "Full profile: current price, bull/bear, upside %, downside %, R/R, EV, asymmetry, verdict, narrative"
    depends_on: []

  - name: implied_upside_downside_output
    description: >
      Implied upside % to a price target, implied downside % to a bear scenario,
      derived R/R ratio, and breakeven probability (probability of reaching PT for
      zero expected return).
    fidelity:
      headline: "Implied upside +X%, downside Y%, R/R Z.Zx"
      summary: "Implied upside, implied downside, R/R ratio, breakeven probability"
      full: "Full output: PT, bear value, current price, implied %, R/R, breakeven, narrative"
    depends_on: []

  - name: rating_assignment
    description: >
      Formal rating recommendation (BUY/OUTPERFORM/HOLD/UNDERPERFORM/SELL) derived
      from ETR and risk/reward ratio, with conviction level (high/medium/low),
      explanatory prose, and verifier consistency flags.
    fidelity:
      headline: "Rating: BUY (high conviction) — ETR +X%, R/R Y.Yx"
      summary: "Rating, conviction, ETR, R/R, why_this_rating summary"
      full: "Full assignment: rating, conviction, ETR, R/R, why_this_rating, narrative, warnings"
    depends_on: []

  - name: football_field_chart_output
    description: >
      Football-field valuation synthesis chart: Plotly JSON for a horizontal bar chart
