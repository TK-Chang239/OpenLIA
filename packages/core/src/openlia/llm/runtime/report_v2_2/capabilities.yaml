engine_version: "2.2"
ga_status: true
helper_count: 113
skill_doc_count: 18
phases_complete: [0, 1, 2, 3, 4, 5]

# ---------------------------------------------------------------------------
# Engine capabilities
# ---------------------------------------------------------------------------
supported:
  - id: four_tier_helper_schema
    summary: "Every helper carries L1/L1.5/L2/L3 schema tiers (directory, selection_guidance, mechanical_contract, skill_doc)"
  - id: artifact_type_registry
    summary: "Closed ArtifactType registry with DAG validation — artifact deps declared and checked at registration"
  - id: stage_7a_materialization
    summary: "Pure-Python, deterministic Stage 7a materializer with highest-fidelity-wins dedup and three-fidelity rendering (HEADLINE/SUMMARY/FULL)"
  - id: stage_7b_drafter_prompt
    summary: "Per-section drafter prompt builder (Stage 7b) with threading, thesis injection, and artifact provenance headers"
  - id: stage_8_verifier
    summary: "18-type verifier with advisory and blocking issue severities; retryable on blocking issues"
  - id: stage_5_planner
    summary: "LLM-based Stage 5 planner rewrites helper selections and emits PlannerOverrides for Stage 7a"
  - id: sector_routing
    summary: "GICS-code-based sector template routing to 5 sector modules (banks, REITs, pharma, energy, insurance)"
  - id: three_layer_template_merge
    summary: "Template defaults → planner overrides → verifier repair (3-layer merge) per artifact-injection §4.3"
  - id: token_cost_telemetry
    summary: "Stage 7a and Stage 7b token-cost telemetry via TelemetryCollector (per-artifact and per-drafter-call events)"
  - id: skill_docs_18_complex_helpers
    summary: "All 18 complex helpers per schema-and-skills §6 carry a skills/<name>.md file and wired SkillDocRef"
  - id: eodhd_adapter_suite
    summary: "20 EODHD adapter helpers covering prices, fundamentals, dividends, splits, insider transactions, sentiment"
  - id: financetoolkit_integration
    summary: "15 FinanceToolkit wrappers for profitability, growth, solvency, DuPont, Piotroski F-score"
  - id: statsmodels_helpers
    summary: "6 narrow-scope statsmodels wrappers: OLS regression, GARCH volatility, stationarity, autocorrelation, heteroskedasticity, VAR"
  - id: dcf_engine
    summary: "Full DCF engine with mid-year convention, scenario weighting, sensitivity grid, reverse DCF, WACC builder"
  - id: comparables_suite
    summary: "Peer comparables with combined-range methodology, NM handling, justified multiples, DDM family, SOTP"
  - id: business_quality_suite
    summary: "34 business-quality helpers: margins, ROIC, FCF conversion, capital allocation, earnings quality, organic/inorganic growth"
  - id: forensic_suite
    summary: "8 forensic helpers: Beneish M-score, Altman Z variants, 5-step DuPont, statement integrity, dividend safety, debt-maturity ladder"
  - id: signal_helpers
    summary: "3 signal helpers: insider_signal_panel (Form 4), historical_multiple_trends, moving_average_panel"
  - id: decision_layer
    summary: "7 decision helpers: price_target_blender, ETR, risk-reward calculator, rating_band_assigner, football-field chart, implied upside/downside, business_investment"
  - id: sector_modules_wave1
    summary: "5 sector modules: banks (NIM/CET1/ROTCE), REITs (FFO/AFFO/NAV), pharma rNPV, energy/E&P (EBITDAX/netback), insurance (combined ratio/EV)"
  - id: output_helpers
    summary: "4 output helpers: chart_builder, football_field_chart, workbook_builder (multi-sheet xlsx), excel_builder (deprecated)"

unsupported:
  - id: extra_passes
    summary: "Additional LLM review/check passes beyond the standard pipeline"
    detect_in_prompt:
      - "extra LLM check"
      - "review pass"
      - "second opinion"
      - "devil's advocate"
      - "have another LLM verify"
    detect_in_template_keys:
      - extra_passes
      - extra_calls
      - reviewer_passes
      - check_passes
    planned_in: "2.3"
    user_message: |
      Extra LLM review/check passes are not supported in v2.2.
  - id: wave2_sector_modules
    summary: "Mining, Retail, Telecom, Semis, Airlines sector modules"
    planned_in: "Phase 5"
    user_message: |
      Wave 2 sector modules (Mining, Retail, Telecom, Semis, Airlines) are
      deferred to Phase 5. Use the default stock_initiation_v2 template.
  - id: qualitative_framework_helpers
    summary: "Porter 5-forces, SWOT, competitive moat scoring via LLM"
    planned_in: "Phase 5 (task #9)"
    user_message: |
      Qualitative framework helpers are deferred to Phase 5.
  - id: verifier_process_quality_extensions
    summary: "Cross-section coherence pass, factual-consistency LLM check, citation resolver"
    planned_in: "Phase 5 (task #10)"
    user_message: |
      Verifier process-quality extensions are deferred to Phase 5.

